name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.16.1"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy pydantic
      - run: mypy app/ calculator/ parser/ --ignore-missing-imports --check-untyped-defs || echo "mypy warnings (non-blocking)"

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Run tests
        env:
          DB_PATH: ":memory:"
        run: python -m pytest tests/ -v --tb=short --junitxml=report.xml
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: report.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: pricer3d:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://47.106.102.208
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_USER" ] || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=(DEPLOY_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 600s
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="$HOME/pricer3d"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then
              echo "? $APP_DIR exists but is not a Git repository"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
            fi

            echo "Synchronizing main with origin..."
            git -C "$APP_DIR" remote set-url origin "$REPO_URL"
            git -C "$APP_DIR" fetch --prune origin main
            git -C "$APP_DIR" checkout --force -B main origin/main

            echo "Running deployment script..."
            SKIP_GIT_PULL=1 bash "$APP_DIR/deploy/one_click_deploy.sh"
