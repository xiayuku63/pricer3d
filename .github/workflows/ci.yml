name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.16.1"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy pydantic
      - run: mypy app/ calculator/ parser/ --ignore-missing-imports --check-untyped-defs || echo "mypy warnings (non-blocking)"

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Run tests
        env:
          DB_PATH: ":memory:"
        run: python -m pytest tests/ -v --tb=short --junitxml=report.xml
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: report.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: pricer3d:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/pricer3d-image.tar

      - name: Upload Docker image artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: pricer3d-image-${{ github.sha }}
          path: /tmp/pricer3d-image.tar

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://47.106.102.208
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_USER" ] || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=(DEPLOY_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid unencrypted private SSH key"
            exit 1
          fi

      - name: Checkout deployment revision
        uses: actions/checkout@v7

      - name: Package deployment revision
        run: git archive --format=tar.gz --output="pricer3d-release-${{ github.sha }}.tar.gz" HEAD

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: pricer3d-image-${{ github.sha }}

      - name: Upload deployment revision
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 600s
          source: pricer3d-release-${{ github.sha }}.tar.gz
          target: /tmp
          overwrite: true

      - name: Upload Docker image
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 600s
          source: pricer3d-image.tar
          target: /tmp
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 600s
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="$HOME/pricer3d"
            RELEASE_ID="${{ github.sha }}"
            ARCHIVE="/tmp/pricer3d-release-${RELEASE_ID}.tar.gz"
            STAGE_DIR="/tmp/pricer3d-stage-${RELEASE_ID}"
            MIGRATION_DIR="/tmp/pricer3d-migration-${RELEASE_ID}"

            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR" "$MIGRATION_DIR/data"
            tar -xzf "$ARCHIVE" -C "$STAGE_DIR"

            if [ -f "$APP_DIR/.env.prod" ]; then
              cp "$APP_DIR/.env.prod" "$STAGE_DIR/.env.prod"
            fi

            # Preserve data from the legacy container before replacing it.
            if docker inspect pricer3d >/dev/null 2>&1; then
              docker cp pricer3d:/app/data/. "$MIGRATION_DIR/data/" 2>/dev/null || true
              docker rm -f pricer3d
            fi

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name '.env.prod' -exec rm -rf -- {} +
            cp -a "$STAGE_DIR"/. "$APP_DIR"/
            docker load --input "/tmp/pricer3d-image.tar"
            docker tag "pricer3d:${RELEASE_ID}" pricer3d-app:latest
            rm -f "$ARCHIVE" "/tmp/pricer3d-image.tar"
            rm -rf "$STAGE_DIR"

            echo "Running deployment script with preloaded image..."
            SKIP_GIT_PULL=1 SKIP_DOCKER_BUILD=1 bash "$APP_DIR/deploy/one_click_deploy.sh"

            # Restore legacy /app/data into the new persistent volume.
            if [ -d "$MIGRATION_DIR/data" ] && docker inspect pricer3d-app >/dev/null 2>&1; then
              docker cp "$MIGRATION_DIR/data/." pricer3d-app:/app/data/
              docker restart pricer3d-app
              for i in $(seq 1 12); do
                sleep 5
                if curl -sf http://127.0.0.1:5000/healthz > /dev/null 2>&1; then
                  echo "Health check passed after data migration"
                  break
                fi
                if [ "$i" -eq 12 ]; then
                  docker compose -f "$APP_DIR/docker-compose.prod.yml" logs --tail=50 app
                  exit 1
                fi
              done
            fi

            rm -rf "$MIGRATION_DIR"
            echo "Checking public HTTP endpoint on port 8080..."
            if ! curl -sf http://127.0.0.1:8080/healthz > /dev/null 2>&1; then
              docker compose -f "$APP_DIR/docker-compose.prod.yml" logs --tail=50 nginx
              exit 1
            fi

            echo "Deployment successful"