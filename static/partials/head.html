<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>3D打印自动报价系统 DEMO</title>
    <script>
        (() => {
            const key = 'pricer3d_theme_v1';
            const saved = localStorage.getItem(key);
            const dark = saved === 'dark' || (saved !== 'light' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=8">
    <link rel="stylesheet" href="/static/css/auth.css?v=1">
    <link rel="stylesheet" href="/static/css/onboarding.css?v=5">
    <link rel="stylesheet" href="/static/css/mobile.css?v=4">
    <link rel="stylesheet" href="/static/css/table-enhancements.css?v=1">
    <link rel="stylesheet" href="/static/css/liquid-glass.css?v=2">
    <style>
      .dark select option:checked,
      .dark select option:hover,
      .dark select option:focus {
        background-color: #006ad0 !important;
        color: #ffffff !important;
      }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "/static/js/vendor/three.module.js",
                "three/addons/": "/static/js/vendor/addons/"
            }
        }
    </script>
</head>
