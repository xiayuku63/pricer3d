<!-- 管理员用户管理弹窗 -->
<div id="admin-users-modal" class="hidden fixed inset-0 z-[75] admin-users-modal" role="dialog" aria-modal="true" aria-labelledby="admin-users-modal-title">
    <div id="admin-users-backdrop" class="absolute inset-0" style="background-color: var(--color-overlay);"></div>
    <div class="relative z-10 h-full w-full flex items-center justify-center p-3 sm:p-5">
        <div class="admin-shell w-full h-full max-w-[1440px] max-h-[94vh] overflow-y-auto">
            <section class="modal-glass-surface tw-card admin-panel">
                <header class="admin-modal-header">
                    <div>
                        <div class="eyebrow">Operations console</div>
                        <div class="flex items-end justify-between gap-4 flex-wrap mt-1">
                            <div><h1 id="admin-users-modal-title" class="text-2xl font-semibold tw-text-heading">用户管理</h1><p class="text-xs tw-text-muted mt-2">管理账号权益，查看关键操作与服务运行状态。</p></div>
                            <p id="msg" class="hidden text-xs"></p>
                        </div>
                    </div>
                    <button id="admin-users-close-btn" type="button" class="tw-btn-secondary px-3 py-2 text-xs">关闭</button>
                </header>
                <nav class="tabs" aria-label="管理模块">
                    <button data-tab="users" type="button" class="tab-btn active">用户 <span id="user-count" class="tw-text-muted"></span></button>
                    <button data-tab="audit" type="button" class="tab-btn">审计日志</button>
                    <button data-tab="metrics" type="button" class="tab-btn">运行监控</button>
                </nav>
                <div id="tab-users">
                    <div class="toolbar"><div class="searchbar"><input id="search-input" type="search" class="tw-input px-3 py-2 text-sm" placeholder="搜索用户名、邮箱或手机号" /><button id="search-btn" type="button" class="tw-btn-primary px-4 py-2 text-xs">查询</button></div><button id="users-refresh-btn" type="button" class="tw-btn-ghost px-3 py-2 text-xs">刷新</button></div>
                    <div class="table-wrap"><table><thead><tr><th>ID</th><th>账号</th><th>邮箱</th><th>手机号</th><th>权益</th><th>验证状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody id="users-tbody"></tbody></table></div>
                    <div id="users-pagination" class="pagination"></div>
                </div>
                <div id="tab-audit" class="hidden">
                    <div class="toolbar"><div class="searchbar"><input id="audit-q" type="search" class="tw-input px-3 py-2 text-sm" placeholder="搜索 action、用户名、IP、路径或 request_id" /><button id="audit-search-btn" type="button" class="tw-btn-primary px-4 py-2 text-xs">查询</button></div></div>
                    <div class="table-wrap"><table><thead><tr><th>时间</th><th>操作</th><th>用户</th><th>IP</th><th>请求</th><th>Request ID</th><th>详情</th></tr></thead><tbody id="audit-tbody"></tbody></table></div>
                </div>
                <div id="tab-metrics" class="hidden">
                    <div class="toolbar"><span class="text-xs tw-text-muted">最近运行数据</span><div class="flex gap-2"><button id="metrics-refresh-btn" type="button" class="tw-btn-primary px-3 py-2 text-xs">刷新</button><button id="cleanup-btn" type="button" class="tw-btn-ghost px-3 py-2 text-xs">清理过期数据</button></div></div>
                    <div class="stat-grid"><div class="stat"><div class="stat-label">运行时长</div><div id="m-uptime" class="stat-value">-</div></div><div class="stat"><div class="stat-label">已追踪请求</div><div id="m-req" class="stat-value">-</div></div><div class="stat"><div class="stat-label">平均耗时</div><div id="m-avg" class="stat-value">-</div></div><div class="stat"><div class="stat-label">P95 耗时</div><div id="m-p95" class="stat-value">-</div></div></div>
                    <div class="table-wrap"><table style="min-width:520px"><thead><tr><th>Path</th><th>请求数</th><th>5xx</th><th>平均耗时</th></tr></thead><tbody id="metrics-tbody"></tbody></table></div>
                </div>
            </section>
        </div>
    </div>
</div>
<style>
    .admin-users-modal .admin-shell { margin: 0 auto; }
    .admin-users-modal .admin-panel { padding: 24px; }
    .admin-users-modal .admin-modal-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:0; }
    .admin-users-modal .eyebrow { color:var(--color-primary); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .admin-users-modal .tabs { display:flex; gap:6px; border-bottom:1px solid var(--color-border); margin:24px -24px 20px; padding:0 24px; overflow:auto; }
    .admin-users-modal .tab-btn { border:0; border-bottom:2px solid transparent; background:transparent; color:var(--color-text-muted); padding:12px 14px; white-space:nowrap; cursor:pointer; font-size:13px; font-weight:600; }
    .admin-users-modal .tab-btn.active { color:var(--color-primary); border-bottom-color:var(--color-primary); }
    .admin-users-modal .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .admin-users-modal .searchbar { display:flex; gap:8px; flex:1; min-width:240px; }
    .admin-users-modal .searchbar input { flex:1; }
    .admin-users-modal .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .admin-users-modal .stat { padding:16px; border:1px solid var(--color-border); border-radius:14px; background:var(--color-bg-hover); }
    .admin-users-modal .stat-label { font-size:11px; color:var(--color-text-muted); }
    .admin-users-modal .stat-value { margin-top:8px; color:var(--color-text-strong); font-size:22px; font-weight:700; }
    .admin-users-modal .table-wrap { overflow:auto; border:1px solid var(--color-border); border-radius:14px; }
    .admin-users-modal table { width:100%; border-collapse:collapse; min-width:980px; }
    .admin-users-modal th { background:var(--color-bg); color:var(--color-text-muted); font-size:11px; font-weight:600; text-align:left; white-space:nowrap; }
    .admin-users-modal th, .admin-users-modal td { padding:12px 14px; border-bottom:1px solid var(--color-border); }
    .admin-users-modal td { color:var(--color-text); font-size:12px; white-space:nowrap; }
    .admin-users-modal tbody tr:hover { background:var(--color-bg-hover); }
    .admin-users-modal tbody tr:last-child td { border-bottom:0; }
    .admin-users-modal .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:10px; font-weight:600; }
    .admin-users-modal .badge-blue { color:var(--color-primary-text); background:var(--color-primary-bg); border:1px solid var(--color-primary-border); }
    .admin-users-modal .badge-green { color:var(--color-success-text); background:var(--color-success-bg); border:1px solid var(--color-success-border); }
    .admin-users-modal .badge-gray { color:var(--color-text-secondary); background:var(--color-disabled-bg); border:1px solid var(--color-border); }
    .admin-users-modal .pagination { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:14px; color:var(--color-text-muted); font-size:12px; }
    .admin-users-modal .pagination-actions { display:flex; gap:6px; }
    .admin-users-modal .empty { padding:44px 16px; text-align:center; color:var(--color-text-muted); }
    @media (max-width: 720px) { .admin-users-modal .admin-panel { padding:16px; } .admin-users-modal .tabs { margin-left:-16px; margin-right:-16px; padding:0 16px; } .admin-users-modal .stat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
