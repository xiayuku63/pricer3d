[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Keep CI focused on correctness errors while the existing formatting/import
# backlog is cleaned up separately.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["app", "calculator", "parser"]
